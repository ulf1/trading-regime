[project]
name = "trainer"
version = "0.1.0"
description = "Daily machine learning model training pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch",
    "pandas",
    "google-cloud-storage",
]

[dependency-groups]
dev = [
    "pytest",
    "pytest-cov",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
